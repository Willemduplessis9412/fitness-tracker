# Codemagic builds the iOS app on a Mac in the cloud, signs it and uploads it to App Store Connect
# (TestFlight). Android is still built locally -- see the release notes in the Play Console.
workflows:
  ios-release:
    name: iOS release (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Codemagic -> Team settings -> Integrations -> App Store Connect; the key name must match.
      app_store_connect: FitData ASC key
    environment:
      groups:
        # Codemagic -> fitness-tracker -> Environment variables, group "ios_signing":
        # CERTIFICATE_PRIVATE_KEY (secret) = the RSA private key the distribution certificate uses.
        - ios_signing
      vars:
        BUNDLE_ID: fitdata-fitdata.fit
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        # App Store Connect -> Apps -> FitData -> App Information -> "Apple ID" (a number)
        APP_STORE_APPLE_ID: 6824942192
      node: 22
      xcode: latest
    triggering:
      events: []   # build manually from the Codemagic dashboard
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Sync web app into the iOS project
        script: npx cap sync ios
      - name: Set up code signing
        # Creates (or reuses) the Apple Distribution certificate and App Store profile through the
        # App Store Connect API key from the integration, so nothing has to be made by hand.
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --certificate-key=@env:CERTIFICATE_PRIVATE_KEY --create
          keychain add-certificates
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Set build number (one above the latest on TestFlight)
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          cd ios/App && agvtool new-version -all $((LATEST + 1))
      - name: Build signed .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
